<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#DCE8FF" />
    <script>
      // تم اولیه (قبل از رندر، بدون پرش رنگ): تم سیستم؛ ThemeProvider بعداً انتخاب ذخیره‌شده کاربر را اعمال می‌کند
      try {
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.dataset.palette = 'navy';
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d121f');
      } catch (e) {}
    </script>
    <title>آپارتمانت — محاسبه شارژ ساختمان</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
